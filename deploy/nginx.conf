server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  # Hashed build assets never change.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Short links from scripts/routes.mjs REDIRECTS (tests/nginx.test.mjs keeps them in sync).
  location ~ ^/discord/?$ {
    return 302 https://discord.gg/YjTQKHn8Hs;
  }

  # Moved pages from scripts/routes.mjs MOVED.
  location ~ ^/install/?$ {
    return 301 /docs/install;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
