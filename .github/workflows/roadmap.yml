name: Roadmap

# Copies the public roadmap board (github.com/orgs/nebla-cloud/projects/1) into app/data/roadmap.json once a day.
# A change is committed to main, which redeploys the site. The site build itself never calls GitHub.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: roadmap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync from the board
        env:
          # The job's own token can't read the board's items. ROADMAP_TOKEN is a fine-grained token on the
          # nebla-cloud organization with read-only access to Projects.
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::ROADMAP_TOKEN is not set, so the roadmap was not synced."
            exit 0
          fi
          node scripts/sync-roadmap.mjs
      - name: Check the copy rules
        run: node scripts/check-brand.mjs app/data/roadmap.json
      - name: Commit a change
        run: |
          if git diff --quiet -- app/data/roadmap.json; then
            echo "No change"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/roadmap.json
          git commit -m 'chore(roadmap): sync from the GitHub board'
          git push
