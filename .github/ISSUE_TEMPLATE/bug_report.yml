name: Site problem
description: Something on nebla.io is broken, wrong or hard to read.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL where you saw it.
      placeholder: https://nebla.io/install
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: What you saw and what you expected instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and screen
      placeholder: Firefox 140 on a 390px phone, dark mode
